packages:
  - packages/**
autoInstallPeers: false
allowBuilds:
  #region native-binaries VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV
  # native-binaries: the install script fetches or compiles the platform
  # binary, so the package is non-functional without it.
  '@parcel/watcher': true
  '@swc/core': true
  'chromedriver': true
  'esbuild': true
  'nx': true
  'sharp': true
  'unrs-resolver': true
  #endregion native-binaries ΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛ

  #region postinstalls-benign VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV
  # postinstalls-benign: allowed only to silence pnpm's ignored-build-scripts
  # warning.
  '@clerk/shared': true
  '@nestjs/core': true # OpenCollective funding notice (`opencollective || exit 0`)
  #endregion postinstalls-benign ΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛ

  #region postinstalls-analytics VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV
  # postinstalls-analytics: blocked
  '@mui/x-telemetry': false
  '@scarf/scarf': false
  #endregion postinstalls-analytics ΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛ
overrides:
  #region permanent VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV
  # React must resolve to a single version tree-wide — duplicate React
  # instances break hooks and context. @react-native dictates the version; web
  # agrees. Only ever re-pin (to RN's version if RN moves).
  'react': 19.2.3
  'react-dom': 19.2.3
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  #endregion permanent ΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛ

  #region temporary VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV
  # eslint-plugin-react supports only up to eslint 9; every other
  # plugin is already on eslint 10. Pin eslint to 9 until the plugin ships
  # eslint-10 support, then delete this.
  eslint: 9.39.4

  # @react-native/jest-preset is hard-coded to jest 29, but the
  # repo needs jest 30 (its jest.config.ts is loaded via the jest-30
  # `@jest-config-loader`). Force jest 30 tree-wide so web/node tests share
  # one version; RN-tagged tests fail until RN ships a jest-30 preset — delete then.
  '@jest/create-cache-key-function': ^30.3.0
  '@jest/environment': ^30.3.0
  '@jest/fake-timers': ^30.3.0
  'babel-jest': ^30.3.0
  'jest-environment-node': ^30.3.0
  'jest-mock': ^30.3.0
  'jest-util': ^30.3.0
  #endregion temporary ΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛΛ
