[project]
name = "apps-langchain-5-pdf"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.0",
    # Task queue
    "celery>=5.3.0",
    "redis>=5.0.0",
    # LangChain
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    # Vector store
    "langchain-chroma>=0.2.0",
    # Embeddings
    "langchain-huggingface>=0.1.0",
    # PDF processing
    "pypdf>=4.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "invoke>=2.2.0",
    "watchdog>=4.0.0",
    "tiktoken>=0.7.0",
    "colorama>=0.4.0",
    "backoff>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps_langchain_5_pdf"]
