[project]
name = "apps-langchain-4-agents"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langgraph>=0.2.0",
  "pyboxen>=1.3.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps_langchain_4_agents"]
