version: '3.8'

volumes:
  volume_data_auth:
    driver: local
  volume_data_core:
    driver: local

networks:
  network_router:
    driver: bridge
  network_auth:
    driver: bridge
  network_api_core:
    driver: bridge

secrets:
##  auth-service .env.dev
  router_host:
    file: ./.secrets/router_host
  db_auth_username:
    file: ./.secrets/db_auth_username
  db_auth_password:
    file: ./.secrets/db_auth_password
  keycloak_admin_username:
    file: ./.secrets/keycloak_admin_username
  keycloak_admin_password:
    file: ./.secrets/keycloak_admin_password

## apps-travel-log-api-core .env.dev
  db_core_username:
    file: ./.secrets/db_core_username
  db_core_password:
    file: ./.secrets/db_core_password
  keycloak_secret_admin_cli:
    file: ./.secrets/keycloak_secret_admin_cli
  keycloak_secret_client_api_core:
    file: ./.secrets/keycloak_secret_client_api_core

services:
  router:
#    image: lolero/travel-log-router:dev
    image: lolero/travel-log-router
    user: '${USER_UID}:${USER_UID}'
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      auth-service:
        condition: service_healthy
      api-core:
        condition: service_healthy
      client-web:
        condition: service_healthy
    networks:
      - network_router
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '5'
  db-auth:
    image: postgres:18.0-alpine3.22
    user: '${USER_UID}:${USER_UID}'
    command: ['postgres']
    ports:
      - '5433:5432'
    secrets:
      - db_auth_username
      - db_auth_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_auth_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_auth_password
      POSTGRES_DB: auth
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$(cat /run/secrets/db_auth_username) -d auth']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - network_auth
    volumes:
      - volume_data_auth:/var/lib/postgresql/data
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '5'
  auth-service:
#    image: lolero/travel-log-auth-service:dev
    image: lolero/travel-log-auth-service
    user: '${USER_UID}:${USER_UID}'
    secrets:
      - router_host
      - db_auth_username
      - db_auth_password
      - keycloak_admin_username
      - keycloak_admin_password
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        export KC_HOSTNAME=$$(cat /run/secrets/router_host)
        export KC_DB_USERNAME=$$(cat /run/secrets/db_auth_username)
        export KC_DB_PASSWORD=$$(cat /run/secrets/db_auth_password)
        export KEYCLOAK_ADMIN=$$(cat /run/secrets/keycloak_admin_username)
        export KEYCLOAK_ADMIN_PASSWORD=$$(cat /run/secrets/keycloak_admin_password)
        /opt/keycloak/bin/kc.sh start --optimized --import-realm --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db-auth
      KC_DB_URL_DATABASE: auth
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/9000 && echo -e "GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    depends_on:
      db-auth:
        condition: service_healthy
    networks:
      - network_router
      - network_auth
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '5'
  db-core:
    image: postgres:18.0-alpine3.22
    user: '${USER_UID}:${USER_UID}'
    command: ['postgres']
    ports:
      - '5434:5432'
    secrets:
      - db_core_username
      - db_core_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_core_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_core_password
      POSTGRES_DB: core
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$(cat /run/secrets/db_core_username) -d core']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - network_api_core
    volumes:
      - volume_data_core:/var/lib/postgresql/data
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '5'
  api-core:
#    image: lolero/travel-log-api-core:dev
    image: lolero/travel-log-api-core
    user: '${USER_UID}:${USER_UID}'
    secrets:
      - router_host
      - db_core_username
      - db_core_password
      - keycloak_secret_admin_cli
      - keycloak_secret_client_api_core
    extra_hosts:
      - '${ROUTER_HOST}:host-gateway'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        export ROUTER_HOST=$$(cat /run/secrets/router_host)
        export DB_CORE_USERNAME=$$(cat /run/secrets/db_core_username)
        export DB_CORE_PASSWORD=$$(cat /run/secrets/db_core_password)
        export KEYCLOAK_SECRET_ADMIN_CLI=$$(cat /run/secrets/keycloak_secret_admin_cli)
        export KEYCLOAK_SECRET_CLIENT_API_CORE=$$(cat /run/secrets/keycloak_secret_client_api_core)
        node build/main.js
    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      DB_CORE_HOST: db-core
      DB_CORE_PORT: 5432
      DB_CORE_DATABASE: core
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/3000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      auth-service:
        condition: service_healthy
      db-core:
        condition: service_healthy
    networks:
      - network_router
      - network_api_core
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '5'
  client-web:
#    image: lolero/travel-log-client-web:dev
    image: lolero/travel-log-client-web
    user: '${USER_UID}:${USER_UID}'
    secrets:
      - router_host
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        export VITE_ROUTER_HOST=$$(cat /run/secrets/router_host)
        envsubst '$$VITE_ROUTER_HOST' < /usr/share/nginx/html/index.html > /tmp/index.html
        mv /tmp/index.html /usr/share/nginx/html/index.html
        for file in /usr/share/nginx/html/assets/*.js; do
          envsubst '$$VITE_ROUTER_HOST' < "$$file" > /tmp/out.js
          mv /tmp/out.js "$$file"
        done
        nginx -g 'daemon off;'
    environment:
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/80']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      api-core:
        condition: service_healthy
    networks:
      - network_router
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '5'
