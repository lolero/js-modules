version: '3'

volumes:
  volume_data_auth:
    driver: local
  volume_data_core:
    driver: local

networks:
  network_router:
    driver: bridge
  network_auth:
    driver: bridge
  network_api_core:
    driver: bridge

services:
  router:
    image: nginx:1.29.1-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - auth-service
    networks:
      - network_router
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ../../service-images/router/nginx.conf.router.dev:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  db-auth:
    image: postgres:18.0-alpine3.22
    command: [ 'postgres']
    ports:
      - '${DB_AUTH_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_AUTH_USERNAME}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD}
      POSTGRES_DB: ${DB_AUTH_DATABASE}
    networks:
      - network_auth
    volumes:
      - volume_data_auth:/var/lib/postgresql/data
  auth-service:
    image: quay.io/keycloak/keycloak:26.3.5-0
    command: ['start-dev', '--import-realm', '--log-level=INFO,org.keycloak.services:DEBUG']
    environment:
      KC_DB_USERNAME: ${DB_AUTH_USERNAME}
      KC_DB_PASSWORD: ${DB_AUTH_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: db-auth
      KC_DB_URL_DATABASE: ${DB_AUTH_DATABASE}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: 'false' # Allows tokens from multiple hostnames for multi-issuer support
      KC_HOSTNAME_DEBUG: 'true' # Enable hostname debug logging
    depends_on:
      - db-auth
    networks:
      - network_router
      - network_auth
    volumes:
      - ../../service-images/auth-service/backup/realm-backup.dev.json:/opt/keycloak/data/import/realm-backup.json
      - ../../service-images/auth-service/providers:/opt/keycloak/providers
  db-core:
    image: postgres:18.0-alpine3.22
    command: ['postgres']
    ports:
      - '${DB_CORE_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_CORE_USERNAME}
      POSTGRES_PASSWORD: ${DB_CORE_PASSWORD}
      POSTGRES_DB: ${DB_CORE_DATABASE}
    networks:
      - network_api_core
    volumes:
      - volume_data_core:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - network_auth
