# https://docs.astral.sh/ruff/configuration/

line-length = 80
indent-width = 2
target-version = "py311"

[lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = ["E501"] # line too long (handled by formatter)

[format]
indent-style = "space"
