[project]
name = "js-modules"
version = "0.0.0"
description = "Python packages workspace for js-modules monorepo"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.9.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.uv.workspace]
members = [
  "packages/apps/langchain/apps-langchain-1-basics",
  "packages/apps/langchain/apps-langchain-2-chatbot",
  "packages/apps/langchain/apps-langchain-3-facts",
  "packages/apps/langchain/apps-langchain-4-agents",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
