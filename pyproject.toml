[project]
name = "js-modules"
version = "0.0.0"
description = "Python packages workspace for js-modules monorepo"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-watch>=4.2.0",
  "ruff>=0.9.0",
  "yamllint>=1.35.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.0.0",
]

[tool.uv.workspace]
members = [
  "packages/apps/langchain/apps-langchain-1-basics",
  "packages/apps/langchain/apps-langchain-2-chatbot",
  "packages/apps/langchain/apps-langchain-3-facts",
  "packages/apps/langchain/apps-langchain-4-agents",
  "packages/apps/langchain/apps-langchain-5-pdf",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
